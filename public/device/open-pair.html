<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open AutoReplyBot — Pair</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5fb;
      color: #1a1b2e;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(40, 30, 90, 0.08);
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #5b5f7a; line-height: 1.45; font-size: 0.95rem; }
    .code {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      margin: 12px 0 20px;
      font-variant-numeric: tabular-nums;
    }
    a.btn, button.btn {
      display: inline-block;
      margin: 6px 4px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 0;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #6d28d9; color: #fff; }
    .secondary { background: #eef0f8; color: #1a1b2e; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pair with AutoReplyBot</h1>
    <p id="status">Opening the app…</p>
    <div id="code-wrap" class="code" hidden></div>
    <p id="hint" class="err" hidden></p>
    <div id="actions" hidden>
      <a id="open-app" class="btn primary" href="#">Open app</a>
      <a class="btn secondary" href="/device/">Open website</a>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const uid = params.get("uid") || "";
      const code = params.get("code") || "";
      const token = params.get("token") || "";
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");
      const actions = document.getElementById("actions");
      const codeWrap = document.getElementById("code-wrap");
      const openApp = document.getElementById("open-app");

      if (!code && !token) {
        status.textContent = "Missing pairing details.";
        hint.hidden = false;
        hint.textContent = "Ask the website user to generate a new code and share again.";
        actions.hidden = false;
        openApp.hidden = true;
        return;
      }

      if (code) {
        codeWrap.hidden = false;
        codeWrap.textContent = code;
      }

      const qs = new URLSearchParams();
      if (uid) qs.set("uid", uid);
      if (code) qs.set("code", code);
      if (token) qs.set("token", token);
      const deepLink = "autoreplybot://pair?" + qs.toString();
      const intentLink =
        "intent://pair?" +
        qs.toString() +
        "#Intent;scheme=autoreplybot;package=com.autoreplybot;S.browser_fallback_url=" +
        encodeURIComponent(window.location.href) +
        ";end";

      openApp.href = deepLink;
      actions.hidden = false;

      function tryOpen() {
        status.textContent = "Opening AutoReplyBot…";
        // Prefer Android intent URL when available; otherwise custom scheme.
        const isAndroid = /Android/i.test(navigator.userAgent);
        window.location.href = isAndroid ? intentLink : deepLink;
      }

      tryOpen();
      setTimeout(function () {
        status.textContent = "If the app did not open, tap Open app (install AutoReplyBot first, then sign in).";
        hint.hidden = false;
        hint.textContent =
          "Once signed in, the phone pairs this website automatically with all trusted options enabled.";
      }, 1600);
    })();
  </script>
</body>
</html>
